[theme]
base = "light"
primaryColor = "#255780"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#172B3A"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true
fileWatcherType = "none"

[global]
developmentMode = false

[browser]
gatherUsageStats = false
